# GraphQL Schema для сервиса управления клиентскими данными
# Основано на анализе REST API из Swagger контракта

# Основные типы данных
type Client {
  id: ID!
  name: String!
  age: Int!
}

type Document {
  id: ID!
  type: String!
  number: String!
  issueDate: String!
  expiryDate: String!
}

type Relative {
  id: ID!
  relationType: String!
  name: String!
  age: Int!
}

# Запросы (Queries) - эквиваленты REST API операций
type Query {
  # Получить информацию о клиенте по ID
  # Эквивалент GET /clients/{id}
  client(id: ID!): Client
  
  # Получить список документов клиента
  # Эквивалент GET /clients/{id}/documents
  clientDocuments(clientId: ID!): [Document!]!
  
  # Получить информацию о родственниках клиента
  # Эквивалент GET /clients/{id}/relatives
  clientRelatives(clientId: ID!): [Relative!]!
}
